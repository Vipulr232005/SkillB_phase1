<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillBridge - Profile</title>
    <!-- Google Fonts: Fraunces & Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --teal-deep: #0b2e2b;
            --teal-mid: #0d9488;
            --amber: #d97706;
            --cream: #fcfbf4;
            --cream-surface: #ffffff;
            --text-main: #1c2d2a;
            --text-muted: #64748b;
            --font-display: 'Fraunces', serif;
            --font-body: 'Space Grotesk', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--cream);
            color: var(--text-main);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Header */
        .top-bar {
            width: 100%;
            padding: 1.25rem 2rem;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            position: relative;
        }

        /* Hamburger Menu Icon Button */
        .hamburger-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 38px;
            height: 30px;
            z-index: 1100;
        }

        .hamburger-btn span {
            display.block;
            height: 3px;
            width: 100%;
            background-color: var(--teal-deep);
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        /* Active Hamburger animation */
        .hamburger-btn.active span:nth-child(1) {
            transform: translateY(11px) rotate(45deg);
        }
        .hamburger-btn.active span:nth-child(2) {
            opacity: 0;
        }
        .hamburger-btn.active span:nth-child(3) {
            transform: translateY(-11px) rotate(-45deg);
        }

        /* Dropdown Menu */
        .dropdown-menu {
            position: absolute;
            top: 4rem;
            right: 2rem;
            background-color: var(--teal-deep);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            padding: 0.75rem 0;
            min-width: 180px;
            display: none;
            flex-direction: column;
            z-index: 1000;
        }

        .dropdown-menu.show {
            display: flex;
        }

        .dropdown-menu a {
            color: var(--cream);
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 500;
            transition: background-color 0.2s ease;
        }

        .dropdown-menu a:hover {
            background-color: var(--teal-mid);
        }

        /* Profile Content */
        .content-container {
            max-width: 650px;
            margin: auto;
            text-align: center;
            padding: 2rem;
        }

        .content-container h1 {
            font-family: var(--font-display);
            font-size: 2.5rem;
            color: var(--teal-deep);
            margin-bottom: 1rem;
        }

        .content-container p {
            font-size: 1.15rem;
            color: var(--text-muted);
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <header class="top-bar">
        <button class="hamburger-btn" id="hamburgerBtn" aria-label="Toggle Navigation Menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="dropdown-menu" id="dropdownMenu">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'profile' %}">Profile</a>
            <a href="/accounts/login/">Sign In</a>
        </nav>
    </header>

    <main class="content-container">
        <h1>User Profile</h1>
        <p>Your profile information will be displayed here.</p>
    </main>

    <script>
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const dropdownMenu = document.getElementById('dropdownMenu');

        hamburgerBtn.addEventListener('click', () => {
            hamburgerBtn.classList.toggle('active');
            dropdownMenu.classList.toggle('show');
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', (event) => {
            if (!hamburgerBtn.contains(event.target) && !dropdownMenu.contains(event.target)) {
                hamburgerBtn.classList.remove('active');
                dropdownMenu.classList.remove('show');
            }
        });
    </script>
</body>
</html>
