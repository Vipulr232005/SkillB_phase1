{% extends "account/_auth_base.html" %}
{% block title %}Continue with {{ provider.name }}{% endblock %}

{% block content %}
<h1>Continue with {{ provider.name }}</h1>
<p class="lede">You'll be sent to {{ provider.name }} to confirm, then brought back here.</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn-continue">Continue to {{ provider.name }}</button>
</form>
<p class="auth-alt"><a href="{% url 'account_login' %}">Use a different method</a></p>
{% endblock %}
