<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting Social Account - Skill Bridge</title>
    <!-- Google Fonts: Fraunces & Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --teal-deep: #0b2e2b;
            --teal-mid: #0d9488;
            --amber: #d97706;
            --cream: #fcfbf4;
            --cream-surface: #ffffff;
            --text-main: #1c2d2a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --font-display: 'Fraunces', serif;
            --font-body: 'Space Grotesk', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--cream);
            color: var(--text-main);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .auth-container {
            width: 100%;
            max-width: 400px;
        }

        .auth-card {
            background-color: var(--cream-surface);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.25rem 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            text-align: center;
        }

        .auth-title {
            font-family: var(--font-display);
            font-size: 1.65rem;
            font-weight: 700;
            color: var(--teal-deep);
            margin-bottom: 0.5rem;
        }

        .auth-subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 1.75rem;
            line-height: 1.5;
        }

        .btn-confirm {
            width: 100%;
            padding: 0.8rem;
            background-color: var(--teal-deep);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-family: var(--font-body);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-confirm:hover {
            background-color: var(--teal-mid);
            box-shadow: 0 4px 12px rgba(13, 148, 136, 0.2);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1 class="auth-title">Sign In via {{ provider.name }}</h1>
            <p class="auth-subtitle">You are about to sign in using your {{ provider.name }} account.</p>

            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn-confirm">Continue to {{ provider.name }}</button>
            </form>
        </div>
    </div>
</body>
</html>
