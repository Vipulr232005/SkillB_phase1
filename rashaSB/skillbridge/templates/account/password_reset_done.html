<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Your Email - Skill Bridge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --teal-deep: #0b2e2b;
            --teal-mid: #0d9488;
            --amber: #d97706;
            --cream: #fcfbf4;
            --cream-surface: #ffffff;
            --text-main: #1c2d2a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --font-display: 'Fraunces', serif;
            --font-body: 'Space Grotesk', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--cream);
            color: var(--text-main);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .auth-container { width: 100%; max-width: 400px; }

        .auth-card {
            background-color: var(--cream-surface);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            text-align: center;
        }

        .status-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 1.25rem;
            border-radius: 50%;
            background-color: rgba(13, 148, 136, 0.12);
            color: var(--teal-mid);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-title {
            font-family: var(--font-display);
            font-size: 1.65rem;
            font-weight: 700;
            color: var(--teal-deep);
            margin-bottom: 0.5rem;
        }

        .auth-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.55;
            margin-bottom: 1.5rem;
        }

        .btn-continue {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.8rem 1.25rem;
            background-color: var(--teal-deep);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-family: var(--font-body);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-continue:hover {
            background-color: var(--teal-mid);
            box-shadow: 0 4px 12px rgba(13, 148, 136, 0.2);
            transform: translateY(-1px);
        }

        .auth-footer {
            border-top: 1px solid var(--border-color);
            margin-top: 1.5rem;
            padding-top: 1rem;
            text-align: center;
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        .auth-footer a {
            color: var(--teal-mid);
            font-weight: 600;
            text-decoration: none;
        }

        .auth-footer a:hover {
            color: var(--teal-deep);
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="status-icon">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
            </div>
            <h1 class="auth-title">Check Your Email</h1>
            <p class="auth-subtitle">
                We sent a password reset link to your email. Check your inbox (and spam folder). If it doesn't arrive in a few minutes, try again.
            </p>
            <a href="/accounts/login/" class="btn-continue">Back to Sign In</a>
            <div class="auth-footer">
                Didn't get it? <a href="/accounts/password/reset/">Resend link</a>
            </div>
        </div>
    </div>
</body>
</html>
