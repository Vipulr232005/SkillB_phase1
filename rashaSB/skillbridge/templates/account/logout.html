{% extends "account/_auth_base.html" %}
{% block title %}Log out{% endblock %}
{% block side_heading %}See you next session.{% endblock %}

{% block content %}
<h1>Log out?</h1>
<p class="lede">You can log back in any time. Your credits and sessions stay saved.</p>
<form method="post" action="{% url 'account_logout' %}">
    {% csrf_token %}
    <button type="submit" class="btn-continue">Log out</button>
</form>
<p class="auth-alt"><a href="{% url 'home' %}">Stay logged in</a></p>
{% endblock %}
