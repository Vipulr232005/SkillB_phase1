{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | Skill Bridge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'editor/extras.css' %}">
</head>
<body class="auth-shell">
    <div class="auth-card-y">
        <h1>Sign in to Skill Bridge</h1>
        <p style="color:#78716c;margin-bottom:1rem;">Welcome back.</p>
        <div class="social-row">
            <a href="/accounts/google/login/">Google</a>
            <a href="/accounts/github/login/">GitHub</a>
        </div>
        <form method="post" action="{% url 'account_login' %}">
            {% csrf_token %}
            {% if form.non_field_errors %}
            <div class="flash">{{ form.non_field_errors.0 }}</div>
            {% endif %}
            <div class="form-group">
                <label class="form-label" for="id_login">Username or email</label>
                <input class="form-input" type="text" name="login" id="id_login" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="id_password">Password</label>
                <input class="form-input" type="password" name="password" id="id_password" required>
            </div>
            <button class="btn-continue" type="submit">Continue</button>
        </form>
        <p style="margin-top:1rem;text-align:center;">Need an account? <a href="{% url 'account_signup' %}">Sign up</a></p>
    </div>
</body>
</html>
